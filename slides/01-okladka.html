<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>01 — Okładka</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="../assets/css/slides.css">
<link rel="stylesheet" href="../assets/css/standalone.css">
</head>
<body>

<!-- =========================================================
     SLAJD 01 — OKŁADKA
     Zdjęcie tła: assets/img/01-okladka.jpg
     (wrzuć plik o tej nazwie, a zastąpi tło rysowane CSS-em)
     ========================================================= -->
<section class="slide t-cover" data-slide="01" data-name="Okładka">

  <div class="slide__bg bg--lake"></div>
  <div class="slide__photo" style="background-image: url(../assets/img/01-okladka.jpg)"></div>
  <div class="slide__veil" style="background:linear-gradient(180deg,rgba(12,38,64,.34) 0%,rgba(12,38,64,.10) 34%,rgba(12,38,64,0) 52%,rgba(24,28,36,.14) 76%,rgba(24,28,36,.52) 100%)"></div>
  <div class="slide__frame"></div>

  <div class="slide__content" style="padding:56px 76px 44px">

    <!-- tylko dla tego slajdu -->
    <style>
      [data-slide="01"] .hero {
        font-size: 200px; font-weight: 400; line-height: .9;
        letter-spacing: .03em; text-indent: .03em;
      }
      [data-slide="01"] .club {
        font-family: var(--f-sans); font-size: 63px; font-weight: 300;
        letter-spacing: .17em; text-indent: .17em; color: var(--c-title);
        line-height: 1;
      }
      [data-slide="01"] .script { font-size: 66px; }
      /* lista atrakcji — szeryfowa, jak na oryginale */
      [data-slide="01"] .dot-list {
        font-family: var(--f-display); font-size: 29px; font-weight: 500;
        letter-spacing: .015em; line-height: 1.62; color: var(--c-body);
      }
      [data-slide="01"] .dot::before { width: 6px; height: 6px; opacity: .85; }
      [data-slide="01"] .date {
        font-family: var(--f-display); font-size: 55px; font-weight: 500;
        letter-spacing: .02em; color: var(--c-title); line-height: 1.1;
      }
      /* pasek partnerów */
      [data-slide="01"] .logo-row { gap: 30px; color: #FBE7E0; align-items: center; }
      [data-slide="01"] .logo-row__x { font-size: 19px; opacity: .75; }
      [data-slide="01"] .logo__name { font-family: var(--f-sans); font-size: 27px; font-weight: 300; letter-spacing: .10em; }
      [data-slide="01"] .logo__sub  { font-size: 12px; font-weight: 300; letter-spacing: .30em; margin-top: 6px; opacity: .95; }
    </style>

    <!-- pasek partnerów -->
    <div class="logo-row">

      <div class="logo">
        <div class="logo__name" style="font-family:var(--f-display);font-size:44px;font-weight:400;letter-spacing:.13em"
             data-edit>VIBE</div>
      </div>

      <span class="logo-row__x">&times;</span>

      <div class="logo">
        <div class="logo__name" data-edit>NAD ZATOKĄ</div>
        <div class="logo__sub" data-edit>APARTHOTEL</div>
      </div>

      <span class="logo-row__x">&times;</span>

      <div class="logo">
        <!-- ikona: sztućce (logo Tatarak) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"
             style="width:30px;height:30px;margin:0 auto 5px">
          <path d="M6.4 3.4v5.9M8.6 3.4v5.9M10.8 3.4v5.9M8.6 9.3v11.3"/>
          <path d="M17.6 3.4c-1.4 1.3-2.1 2.9-2.1 4.7 0 1.5.7 2.5 2.1 3v9.5"/>
        </svg>
        <div class="logo__name" style="font-size:25px;letter-spacing:.12em" data-edit>TATARAK</div>
        <div class="logo__sub" style="font-size:10px" data-edit>RESTAURACJA</div>
      </div>

      <span class="logo-row__x">&times;</span>

      <div class="logo">
        <div class="logo__name" style="font-size:25px;letter-spacing:.06em" data-edit>HIGHLANDE<span
          style="display:inline-block;transform:scaleX(-1)">R</span> <span style="font-size:16px">BAY</span></div>
        <div class="logo__sub"
             style="font-family:var(--f-display);font-size:15px;font-weight:500;letter-spacing:.10em;text-transform:none"
             data-edit>Cocktails &amp; Kitchen</div>
      </div>

    </div>

    <!-- tytuł -->
    <h1 class="hero mt-52" data-edit>VIBE</h1>
    <div class="club mt-14" data-edit>SOCIAL CLUB</div>
    <div class="script mt-14" data-edit>- Rooftop Edition -</div>

    <!-- lista atrakcji -->
    <p class="dot-list mt-28" data-edit>
      Pilates <span class="dot">&bull;</span> Joga <span class="dot">&bull;</span> Speed Friending
      <span class="dot">&bull;</span> Warsztat antystresowy <span class="dot">&bull;</span> Taniec
      <span class="dot">&bull;</span> Matcha <span class="dot">&bull;</span><br>
      Pyszne jedzenie <span class="dot">&bull;</span> Relax Zone <span class="dot">&bull;</span> Gift Bag
      <span class="dot">&bull;</span> Losowanie nagród
    </p>

    <div class="grow"></div>

    <!-- data i miejsce -->
    <p class="date" data-edit>22.08 &nbsp; Nad Zatoką, Olsztyn</p>

    <div class="mt-14" style="line-height:0;color:var(--c-title)">
      <!-- ikona: iskra -->
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px;display:inline-block">
        <path d="M12 3c.5 4.3 2 5.9 6.3 6.4-4.3.5-5.8 2.1-6.3 6.4-.5-4.3-2-5.9-6.3-6.4C10 8.9 11.5 7.3 12 3z"/>
      </svg>
    </div>

  </div>
</section>

<script src="../assets/js/slide-runtime.js"></script>
</body>
</html>
