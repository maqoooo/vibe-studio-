<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>06 — Zapisy / CTA</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="../assets/css/slides.css">
<link rel="stylesheet" href="../assets/css/standalone.css">
</head>
<body>

<!-- =========================================================
     SLAJD 06 — ZAPISY / CTA (ostatni slajd karuzeli)
     Zdjęcie tła: assets/img/06-zapisy.jpg
     ========================================================= -->
<section class="slide t-dark" data-slide="06" data-name="Zapisy / CTA">

  <div class="slide__bg bg--dusk"></div>
  <div class="slide__photo" style="background-image: url(../assets/img/06-zapisy.jpg)"></div>
  <div class="slide__veil veil--deep"></div>

  <div class="slide__content">

    <!-- tylko dla tego slajdu -->
    <style>
      [data-slide="06"] .claim-line {
        font-family: var(--f-sans); font-size: 52px; font-weight: 300;
        letter-spacing: .04em; color: #F8EDE8; line-height: 1.35;
      }
      [data-slide="06"] .claim-line em {
        font-family: var(--f-script); font-style: normal;
        font-size: 74px; color: var(--rose-200); line-height: 1;
      }
      [data-slide="06"] .cta-date {
        font-family: var(--f-display); font-size: 82px; font-weight: 300;
        letter-spacing: .10em; color: var(--rose-200); line-height: 1;
      }
      [data-slide="06"] .cta-box {
        border: 1px solid var(--c-line); border-radius: 22px;
        padding: 30px 46px; display: inline-block;
      }
    </style>

    <div class="grow" style="flex-grow:.85"></div>

    <div class="rule" style="--rule-len:170px">
      <span class="rule__mark">
        <!-- ikona: lotos -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round">
          <path d="M12 6.4c1.8 1.9 2.6 3.7 2.6 5.6 0 1.9-.9 3.4-2.6 4.8-1.7-1.4-2.6-2.9-2.6-4.8 0-1.9.8-3.7 2.6-5.6z"/>
          <path d="M12 16.8c-2.4 0-4.4-1-6-3 .5-2 1.6-3.1 3.2-3.3M12 16.8c2.4 0 4.4-1 6-3-.5-2-1.6-3.1-3.2-3.3"/>
        </svg>
      </span>
    </div>

    <p class="claim-line mt-38" data-edit>
      Przyjdź dla <em>VIBE</em>.<br>Zostań dla <em>ludzi</em>.
    </p>

    <div class="mt-70">
      <div class="cta-date" data-edit>22.08</div>
      <div class="lead mt-14" style="font-size:34px;color:#F3E4DE" data-edit>
        Nad Zatoką <span class="dot">&bull;</span> Olsztyn
      </div>
      <div class="micro mt-8" style="color:var(--rose-200);letter-spacing:.22em" data-edit>
        Rooftop nad jeziorem Ukiel
      </div>
    </div>

    <div class="mt-52">
      <div class="cta-box">
        <div class="micro" style="color:var(--rose-200);letter-spacing:.26em;font-size:20px" data-edit>Zapisy</div>
        <div class="mt-8" style="font-family:var(--f-script);font-size:52px;color:#FBF1EC;line-height:1.2" data-edit>
          aplikacja Fitssey
        </div>
        <div class="small mt-8" style="color:rgba(242,228,222,.8)" data-edit>
          Voucher &mdash; do kupienia w Studio VIBE
        </div>
      </div>
    </div>

    <div class="grow"></div>

    <!-- stopka: partnerzy -->
    <div class="logo-row logo-row--light" style="gap:26px;align-items:center">
      <div class="logo">
        <div class="logo__name" style="font-family:var(--f-display);font-size:32px;letter-spacing:.13em"
             data-edit>VIBE</div>
      </div>
      <span class="logo-row__x">&times;</span>
      <div class="logo">
        <div class="logo__name" style="font-family:var(--f-sans);font-size:21px;font-weight:300;letter-spacing:.10em"
             data-edit>NAD ZATOKĄ</div>
        <div class="logo__sub" style="font-size:10px" data-edit>APARTHOTEL</div>
      </div>
      <span class="logo-row__x">&times;</span>
      <div class="logo">
        <div class="logo__name" style="font-family:var(--f-sans);font-size:20px;font-weight:300;letter-spacing:.12em"
             data-edit>TATARAK</div>
        <div class="logo__sub" style="font-size:9px" data-edit>RESTAURACJA</div>
      </div>
      <span class="logo-row__x">&times;</span>
      <div class="logo">
        <div class="logo__name" style="font-family:var(--f-sans);font-size:20px;font-weight:300;letter-spacing:.06em">
          HIGHLANDE<span style="display:inline-block;transform:scaleX(-1)">R</span>
          <span style="font-size:13px">BAY</span></div>
        <div class="logo__sub"
             style="font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:none"
             data-edit>Cocktails &amp; Kitchen</div>
      </div>
    </div>

    <p class="micro mt-28" style="color:rgba(242,228,222,.65);letter-spacing:.20em;font-size:18px" data-edit>
      @vibe.studio <span class="dot">&bull;</span> #VIBESocialClub
    </p>

  </div>
</section>

<script src="../assets/js/slide-runtime.js"></script>
</body>
</html>
